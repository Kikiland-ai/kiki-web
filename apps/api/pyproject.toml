[project]
name = "kiki-profile-api"
version = "0.1.0"
description = "Python Firebase account/profile boundary for Kiki web"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "firebase-admin>=6.9,<8",
  "pydantic-settings>=2.8,<3",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "pillow>=12,<13",
  "httpx>=0.28,<1",
  "websockets>=16,<17",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/kiki_api"]
